<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Camera Captures</title>
  <style>
    body {
      font-family: "Gotham", sans-serif;
      background-color: #1b1b1b;
      color: #fff;
      margin: 0;
      padding: 20px;
    }
    h1 {
      font-size: 28px;
      color: #fff;
    }
    .container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .card {
      background-color: #2c2c2c;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.4);
      transition: transform 0.2s;
    }
    .card:hover {
      transform: scale(1.02);
    }
    .avatar {
      width: 100%;
      height: 160px;
      background-color: #444;
      object-fit: cover;
      border-radius: 8px;
    }
    .info {
      margin-top: 10px;
    }
    .info h2 {
      font-size: 18px;
      margin: 0;
    }
    .info p {
      margin: 4px 0;
      color: #ccc;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>📸 Roblox Camera Captures</h1>
  <div class="container" id="gallery"></div>

  <script>
    // Simulated local storage fetch (you'll replace this with server API)
    const exampleCaptures = JSON.parse(localStorage.getItem("captures") || "[]");

    // Function to generate HTML card
    function createCard(data) {
      const div = document.createElement("div");
      div.className = "card";

      const avatar = `https://www.roblox.com/headshot-thumbnail/image?userId=${data.userId}&width=180&height=180&format=png`;

      div.innerHTML = `
        <img class="avatar" src="${avatar}" alt="Avatar">
        <div class="info">
          <h2>${data.displayName} <span style="font-size:13px;color:#aaa;">(@${data.username})</span></h2>
          <p><strong>User ID:</strong> ${data.userId}</p>
          <p><strong>FOV:</strong> ${data.cameraFOV}°</p>
          <p><strong>Date:</strong> ${data.time}</p>
        </div>
      `;
      return div;
    }

    // Display gallery
    const gallery = document.getElementById("gallery");
    exampleCaptures.forEach(capture => {
      gallery.appendChild(createCard(capture));
    });

    // For testing: uncomment to add a new random capture
    /*
    const mockCapture = {
      userId: 261,
      username: "Roblox",
      displayName: "Roblox",
      cameraFOV: Math.floor(Math.random() * 60 + 20),
      time: new Date().toLocaleString()
    };
    exampleCaptures.push(mockCapture);
    localStorage.setItem("captures", JSON.stringify(exampleCaptures));
    */
  </script>
</body>
</html>
